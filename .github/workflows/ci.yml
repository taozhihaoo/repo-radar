name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Static checks (ruff)
        run: ruff check .

      - name: Unit tests (offline, no GitHub API access)
        run: pytest -v

      - name: CLI smoke checks
        run: |
          python -m src.main --help > /dev/null
          repo-radar --help > /dev/null
